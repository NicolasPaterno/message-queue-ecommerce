services:
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports: ["127.0.0.1:5671:5671", "127.0.0.1:15671:15671"]
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./certs:/etc/rabbitmq/certs:ro
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbitmq_management_agent sample_retention_policies [{global,[{605,1}]},{basic,[{605,1}]},{detailed,[{605,1}]}]'

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql"]

  api:
    build: ..
    command: ["/app", "api"]
    ports: ["8080:8080"]
    volumes: ["./certs/ca.pem:/certs/ca.pem:ro"]
    environment:
      AMQP_URL: amqps://api:${API_PASS}@rabbitmq:5671/%2Fshop
      SSL_CERT_FILE: /certs/ca.pem
      DB_URL: postgres://shop:shop@postgres:5432/shop?sslmode=disable

  worker:
    build: ..
    command: ["/app", "worker"]
    volumes: ["./certs/ca.pem:/certs/ca.pem:ro"]
    environment:
      AMQP_URL: amqps://worker:${WORKER_PASS}@rabbitmq:5671/%2Fshop
      SSL_CERT_FILE: /certs/ca.pem
      DB_URL: postgres://shop:shop@postgres:5432/shop?sslmode=disable
      FAIL_RATE: ${FAIL_RATE:-0}
